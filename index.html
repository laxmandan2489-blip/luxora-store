<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Every product photo is served through images.weserv.nl (see
      getImageUrl() in src/App.jsx). Preconnecting here lets the
      browser finish the DNS lookup + TLS handshake with that host
      ahead of time, in parallel with the rest of the page loading,
      instead of paying that setup cost only when the first photo
      request actually fires - shaves a real chunk off how long a
      product's first photo takes to appear.
    -->
    <link rel="preconnect" href="https://images.weserv.nl" crossorigin />
    <link rel="dns-prefetch" href="https://images.weserv.nl" />
    <!--
      Backend (Render free plan) sleeps when idle. Connect to it and send
      a tiny wake-up ping the moment the HTML arrives, before the app's
      JavaScript has even downloaded, so it is already booting by the
      time the storefront asks for products.
    -->
    <link rel="preconnect" href="https://luxora-store-mkva.onrender.com" crossorigin />
    <script>
      try { fetch("https://luxora-store-mkva.onrender.com/api/health", { mode: "no-cors", cache: "no-store" }).catch(function () {}); } catch (e) {}
    </script>
    <title>SHRIMOH - The Luxury Store</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
